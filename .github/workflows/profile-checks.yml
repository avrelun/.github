name: Profile checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: profile-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-profile.py --revision HEAD
